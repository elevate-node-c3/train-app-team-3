
syntax = "proto3";

package catalog;

// ============================================================================
// Shared
// ============================================================================

message EmptyRequest {}

message IdRequest {
  string id = 1;
}

message DeleteResponse {
  string message = 1;
}

message OperationResponse {
  bool success = 1;
}

// ============================================================================
// Catalog & Trips
// ============================================================================

service CatalogService {
  rpc SearchStations(SearchStationsRequest) returns (SearchStationsResponse);
  rpc SearchTrips(SearchTripsRequest) returns (SearchTripsResponse);
  rpc GetTripStops(GetTripStopsRequest) returns (GetTripStopsResponse);
  rpc GetRecentSearches(GetRecentSearchesRequest) returns (GetRecentSearchesResponse);
  rpc SaveRecentSearch(SaveRecentSearchRequest) returns (OperationResponse);
  rpc QuoteFare(QuoteFareRequest) returns (QuoteFareResponse);
  rpc PublishTimetable(PublishTimetableRequest) returns (OperationResponse);
  rpc ChangeFares(ChangeFaresRequest) returns (OperationResponse);
  rpc DelayTrip(DelayTripRequest) returns (OperationResponse);
  rpc CancelTrip(CancelTripRequest) returns (OperationResponse);
}

message SearchStationsRequest {
  string query = 1;
}

message Station {
  string station_id = 1;
  string name_en = 2;
  string name_ar = 3;
  string governorate = 4;
}

message SearchStationsResponse {
  repeated Station stations = 1;
}

message SearchTripsRequest {
  string origin_station_id = 1;
  string destination_station_id = 2;
  string departure_date = 3;
  string seat_class_id = 4;
  string train_number = 5;
  string departure_time_from = 6;
  string departure_time_to = 7;
  int64 maximum_fare_piastres = 8;
  string train_type = 9;
  TripSort sort = 10;
}

enum TripSort {
  TRIP_SORT_DEPARTURE_TIME = 0;
  TRIP_SORT_DURATION = 1;
  TRIP_SORT_FARE = 2;
}

message TripResult {
  string trip_id = 1;
  string train_number = 2;
  string train_type = 3;
  string seat_class_id = 4;
  string origin_station_id = 5;
  string origin_station_name_en = 6;
  string origin_station_name_ar = 7;
  string departure_at = 8;
  string destination_station_id = 9;
  string destination_station_name_en = 10;
  string destination_station_name_ar = 11;
  string arrival_at = 12;
  int64 duration_minutes = 13;
  int32 intermediate_stop_count = 14;
  int32 available_seats = 15;
  int64 fare_piastres = 16;
  bool sold_out = 17;
}

message SearchTripsResponse {
  repeated TripResult trips = 1;
}

message GetTripStopsRequest {
  string trip_id = 1;
  string origin_station_id = 2;
  string destination_station_id = 3;
}

message TripStop {
  string station_id = 1;
  string station_name_en = 2;
  string station_name_ar = 3;
  string arrival_at = 4;
  string departure_at = 5;
}

message GetTripStopsResponse {
  repeated TripStop stops = 1;
}

message RecentSearch {
  string origin_station_id = 1;
  string destination_station_id = 2;
  string departure_date = 3;
  string return_date = 4;
  string seat_class_id = 5;
  string train_number = 6;
}

message GetRecentSearchesRequest {}

message GetRecentSearchesResponse {
  repeated RecentSearch searches = 1;
}

message SaveRecentSearchRequest {
  RecentSearch search = 1;
}

message QuoteFareRequest {
  string trip_id = 1;
  string seat_class_id = 2;
  string origin_station_id = 3;
  string destination_station_id = 4;
}

message QuoteFareResponse {
  int64 fare_piastres = 1;
}

message PublishTimetableRequest {
  string timetable_id = 1;
}

message ChangeFaresRequest {
  string train_id = 1;
  string seat_class_id = 2;
  string origin_station_id = 3;
  string destination_station_id = 4;
  int64 fare_piastres = 5;
}

message DelayTripRequest {
  string trip_id = 1;
  string from_station_id = 2;
  int32 delay_minutes = 3;
}

message CancelTripRequest {
  string trip_id = 1;
}

// ============================================================================
// Stations
// ============================================================================

service StationService {
  rpc CreateStation(CreateStationRequest) returns (StationResponse);
  rpc GetStations(EmptyRequest) returns (GroupedStationListResponse);
  rpc SearchStations(SearchStationRequest) returns (StationListResponse);
  rpc UpdateStation(UpdateStationRequest) returns (StationResponse);
  rpc UpdateAlternativeNames(UpdateAlternativeNamesRequest) returns (StationResponse);
  rpc UpdateStationStatus(UpdateStationStatusRequest) returns (StationResponse);
}

message StationResponse {
  string id = 1;
  string name = 2;
  string address = 3;
  bool is_active = 4;
  string governorate_id = 5;
  repeated string alternative_names = 6;
  string created_at = 7;
  string updated_at = 8;
}

message StationListResponse {
  repeated StationResponse stations = 1;
}

message GroupedStationResponse {
  string id = 1;
  string name = 2;
  repeated StationResponse stations = 3;
}

message GroupedStationListResponse {
  repeated GroupedStationResponse governorates = 1;
}

message CreateStationRequest {
  string name = 1;
  string address = 2;
  string governorate_id = 3;
  repeated string alternative_names = 4;
}

message UpdateStationRequest {
  string id = 1;
  string name = 2;
  string address = 3;
  string governorate_id = 4;
}

message UpdateAlternativeNamesRequest {
  string id = 1;
  repeated string alternative_names = 2;
}

message UpdateStationStatusRequest {
  string id = 1;
  bool is_active = 2;
}

message SearchStationRequest {
  string q = 1;
}

// ============================================================================
// Governorates
// ============================================================================

service GovernorateService {
  rpc CreateGovernorate(CreateGovernorateRequest) returns (GovernorateResponse);
  rpc GetGovernorates(EmptyRequest) returns (GovernorateListResponse);
  rpc GetGovernorateById(GetGovernorateByIdRequest) returns (GovernorateResponse);
  rpc UpdateGovernorate(UpdateGovernorateRequest) returns (GovernorateResponse);
}

message GovernorateResponse {
  string id = 1;
  string name = 2;
  string created_at = 3;
  string updated_at = 4;
}

message GovernorateListResponse {
  repeated GovernorateResponse governorates = 1;
}

message CreateGovernorateRequest {
  string name = 1;
}

message GetGovernorateByIdRequest {
  string id = 1;
}

message UpdateGovernorateRequest {
  string id = 1;
  string name = 2;
}

// ============================================================================
// Train Types
// ============================================================================

service TrainTypeService {
  rpc CreateTrainType(CreateTrainTypeRequest) returns (TrainTypeResponse);
  rpc GetTrainTypes(EmptyRequest) returns (TrainTypeListResponse);
  rpc GetTrainType(IdRequest) returns (TrainTypeResponse);
  rpc UpdateTrainType(UpdateTrainTypeRequest) returns (TrainTypeResponse);
  rpc DeleteTrainType(IdRequest) returns (DeleteResponse);
}

message CreateTrainTypeRequest {
  string name_ar = 1;
  string name_en = 2;
}

message UpdateTrainTypeRequest {
  string id = 1;
  optional string name_ar = 2;
  optional string name_en = 3;
}

message TrainTypeResponse {
  string id = 1;
  string name_ar = 2;
  string name_en = 3;
}

message TrainTypeListResponse {
  repeated TrainTypeResponse items = 1;
}

// ============================================================================
// Train Classes
// ============================================================================

service TrainClassService {
  rpc CreateTrainClass(CreateTrainClassRequest) returns (TrainClassResponse);
  rpc GetTrainClasses(EmptyRequest) returns (TrainClassListResponse);
  rpc GetTrainClass(IdRequest) returns (TrainClassResponse);
  rpc UpdateTrainClass(UpdateTrainClassRequest) returns (TrainClassResponse);
  rpc DeleteTrainClass(IdRequest) returns (DeleteResponse);
}

message CreateTrainClassRequest {
  string name_ar = 1;
  string name_en = 2;
}

message UpdateTrainClassRequest {
  string id = 1;
  optional string name_ar = 2;
  optional string name_en = 3;
}

message TrainClassResponse {
  string id = 1;
  string name_ar = 2;
  string name_en = 3;
}

message TrainClassListResponse {
  repeated TrainClassResponse items = 1;
}

// ============================================================================
// Trains
// ============================================================================

service TrainService {
  rpc CreateTrain(CreateTrainRequest) returns (TrainResponse);
  rpc GetTrains(EmptyRequest) returns (TrainListResponse);
  rpc GetTrain(IdRequest) returns (TrainResponse);
  rpc UpdateTrain(UpdateTrainRequest) returns (TrainResponse);
  rpc DeleteTrain(IdRequest) returns (DeleteResponse);
}

message CreateTrainRequest {
  int32 number = 1;
  string type_of_train_id = 2;
}

message UpdateTrainRequest {
  string id = 1;
  optional int32 number = 2;
  optional string type_of_train_id = 3;
}

message TrainTypeRef {
  string id = 1;
  string name_ar = 2;
  string name_en = 3;
}

message TrainResponse {
  string id = 1;
  int32 number = 2;
  TrainTypeRef type_of_train = 3;
}

message TrainListResponse {
  repeated TrainResponse items = 1;
}

// ============================================================================
// Coach Layouts
// ============================================================================

service CoachLayoutService {
  rpc CreateCoachLayout(CreateCoachLayoutRequest) returns (CoachLayoutResponse);
  rpc GetCoachLayouts(EmptyRequest) returns (CoachLayoutListResponse);
  rpc GetCoachLayout(IdRequest) returns (CoachLayoutResponse);
  rpc UpdateCoachLayout(UpdateCoachLayoutRequest) returns (CoachLayoutResponse);
  rpc DeleteCoachLayout(IdRequest) returns (DeleteResponse);
}

message CreateCoachLayoutRequest {
  string name_ar = 1;
  string name_en = 2;
  string description = 3;
}

message UpdateCoachLayoutRequest {
  string id = 1;
  optional string name_ar = 2;
  optional string name_en = 3;
  optional string description = 4;
}

message CoachLayoutResponse {
  string id = 1;
  string name_ar = 2;
  string name_en = 3;
  string description = 4;
}

message CoachLayoutListResponse {
  repeated CoachLayoutResponse items = 1;
}

// ============================================================================
// Coaches
// ============================================================================

service CoachService {
  rpc CreateCoach(CreateCoachRequest) returns (CoachResponse);
  rpc GetCoaches(EmptyRequest) returns (CoachListResponse);
  rpc GetCoach(IdRequest) returns (CoachResponse);
  rpc UpdateCoach(UpdateCoachRequest) returns (CoachResponse);
  rpc DeleteCoach(IdRequest) returns (DeleteResponse);
}

message CreateCoachRequest {
  int32 coach_number = 1;
  string train_id = 2;
  string class_of_train_id = 3;
  string coach_layout_id = 4;
}

message UpdateCoachRequest {
  string id = 1;
  optional int32 coach_number = 2;
  optional string train_id = 3;
  optional string class_of_train_id = 4;
  optional string coach_layout_id = 5;
}

message TrainRef {
  string id = 1;
  int32 number = 2;
}

message TrainClassRef {
  string id = 1;
  string name_ar = 2;
  string name_en = 3;
}

message CoachLayoutRef {
  string id = 1;
  string name_ar = 2;
  string name_en = 3;
}

message CoachResponse {
  string id = 1;
  int32 coach_number = 2;
  TrainRef train = 3;
  TrainClassRef class_of_train = 4;
  CoachLayoutRef coach_layout = 5;
}

message CoachListResponse {
  repeated CoachResponse items = 1;
}

// ============================================================================
// Timetables
// ============================================================================

service TimetableService {
  rpc CreateTimetable(CreateTimetableRequest) returns (TimetableResponse);
  rpc GetTimetables(EmptyRequest) returns (TimetableListResponse);
  rpc GetTimetable(IdRequest) returns (TimetableResponse);
  rpc UpdateTimetable(UpdateTimetableRequest) returns (TimetableResponse);
  rpc DeleteTimetable(IdRequest) returns (DeleteResponse);
}

message CreateTimetableRequest {
  string departure_time = 1;
  string effective_from = 2;
  string effective_to = 3;
  repeated string working_days = 4;
  bool status = 5;
  string train_id = 6;
}

message UpdateTimetableRequest {
  string id = 1;
  optional string departure_time = 2;
  optional string effective_from = 3;
  optional string effective_to = 4;
  repeated string working_days = 5;
  optional bool status = 6;
  optional string train_id = 7;
}

message TimetableResponse {
  string id = 1;
  string departure_time = 2;
  string effective_from = 3;
  string effective_to = 4;
  repeated string working_days = 5;
  bool status = 6;
  TrainRef train = 7;
}

message TimetableListResponse {
  repeated TimetableResponse items = 1;
}

// ============================================================================
// Timetable Stops
// ============================================================================

service TimetableStopService {
  rpc CreateTimetableStop(CreateTimetableStopRequest) returns (TimetableStopResponse);
  rpc GetTimetableStops(EmptyRequest) returns (TimetableStopListResponse);
  rpc GetTimetableStop(IdRequest) returns (TimetableStopResponse);
  rpc UpdateTimetableStop(UpdateTimetableStopRequest) returns (TimetableStopResponse);
  rpc DeleteTimetableStop(IdRequest) returns (DeleteResponse);
}

message CreateTimetableStopRequest {
  optional string arrival_time = 1;
  optional string departure_time = 2;
  int32 stop_order = 3;
  string timetable_id = 4;
  string station_id = 5;
}

message UpdateTimetableStopRequest {
  string id = 1;
  optional string arrival_time = 2;
  optional string departure_time = 3;
  optional int32 stop_order = 4;
  optional string timetable_id = 5;
  optional string station_id = 6;
}

message TimetableRef {
  string id = 1;
}

message StationRef {
  string id = 1;
}

message TimetableStopResponse {
  string id = 1;
  optional string arrival_time = 2;
  optional string departure_time = 3;
  int32 stop_order = 4;
  TimetableRef timetable = 5;
  StationRef station = 6;
}

message TimetableStopListResponse {
  repeated TimetableStopResponse items = 1;
}
